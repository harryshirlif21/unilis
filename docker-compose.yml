services:
  app:
    build: .
    image: hilkim21/unilis-app:latest
    container_name: unilis-app
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
      - ./assets/uploads:/var/www/html/assets/uploads
      - ./uploads:/var/www/uploads
      - ./uploads/course_presentations:/var/www/html/uploads/course_presentations
      - ./uploads/course_pdfs:/var/www/html/uploads/course_pdfs
      - ./uploads/course_images:/var/www/html/uploads/course_images
      - ./uploads/course_videos:/var/www/html/uploads/course_videos
      - ./uploads/course_audio:/var/www/html/uploads/course_audio
      - ./uploads/course_diagrams:/var/www/html/uploads/course_diagrams
      - ./assets/assignments:/var/www/html/assets/assignments
      # Runtime data only (recordings). Do not put static app files here — this
      # mount shadows whatever the image ships at that path. The meeting
      # frontend lives in assets/meeting-app/ instead.
      - ./assets/meetings:/var/www/html/assets/meetings
      - ./assets/requested_files:/var/www/html/assets/requested_files
      - ./apache.conf:/etc/apache2/sites-available/000-default.conf.template
    depends_on:
      db:
        condition: service_started
      smart-labs-db:
        condition: service_started
      meeting-server:
        condition: service_healthy
    environment:
      DB_HOST: db
      SMARTLAB_DB_HOST: smart-labs-db
      MYSQL_USER: unilisuser
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-unilispass}
      MYSQL_DATABASE: unilis
      MEETING_PROXY_HOST: meeting-server
      MEETING_PROXY_PORT: "8765"
      MEETING_PYTHON_APP_URL: https://unilis.jhubafrica.com
      MEETING_MEDIA_PORT: "8765"
      MEETING_MEDIA_WS_URL: wss://unilis.jhubafrica.com/ws/media

  meeting-server:
    build:
      context: ./meeting-server
      dockerfile: Dockerfile
    image: hilkim21/unilis-meeting-media:latest
    container_name: unilis-meeting-media
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      HOST: 0.0.0.0
      PORT: "8765"
      # Shared secret for the read-only /api/meetings/* routes. Set the real
      # value in .env (gitignored); unset leaves those routes open.
      MEETING_API_KEY: ${MEETING_API_KEY:-}
      # Comma-separated CORS allowlist. "*" keeps the previous behaviour.
      MEETING_ALLOWED_ORIGINS: ${MEETING_ALLOWED_ORIGINS:-*}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  db:
    image: mysql:8.0.33
    container_name: unilis-db
    restart: always
    # Loopback-bound: the app reaches MySQL over the compose network, so the
    # port only needs to be reachable from the host for admin tooling.
    ports:
      - "127.0.0.1:3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: unilis
      MYSQL_USER: unilisuser
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-unilispass}
    volumes:
      - db_data:/var/lib/mysql
      # No seed mount: the SQL files were removed from the repository. A fresh
      # volume starts empty and must be loaded from a backup restored out of
      # band. Existing volumes are unaffected — entrypoint seeds only ever run
      # against an empty data directory.

  smart-labs-db:
    image: mysql:8.0.33
    container_name: smart-labs-db
    restart: always
    ports:
      - "127.0.0.1:3309:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: unilis_smartlab
      MYSQL_USER: lab_admin
      MYSQL_PASSWORD: ${SMARTLAB_MYSQL_PASSWORD:-lab_password}
    volumes:
      - smart_labs_data:/var/lib/mysql
      # Seed mount removed along with the SQL files. See the note on db above.

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:5.2.1
    container_name: unilis-pma
    restart: unless-stopped
    # Loopback-bound: reach it over an SSH tunnel rather than publishing a
    # database admin console to the internet.
    ports:
      - "127.0.0.1:8081:80"
    environment:
      PMA_HOSTS: db,smart-labs-db
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}

volumes:
  db_data:
  smart_labs_data:
  vendor: