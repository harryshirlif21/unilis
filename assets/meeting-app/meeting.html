<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>UNILIS Meeting</title>
    <!--
      The meeting page moved to meeting.php, which stamps a cache-busting
      version onto each script and stylesheet. This shim only exists so links
      and open tabs still holding the old URL land in the right place; it must
      never grow markup of its own, or the two pages will drift apart.
    -->
    <script>
        location.replace('meeting.php' + location.search + location.hash);
    </script>
</head>
<body>
    <p>Redirecting to the meeting&hellip;</p>
    <!-- No plain link: the meeting id and display name live in the query
         string, so a link that dropped them would open an empty meeting. -->
    <noscript>JavaScript is required to join a UNILIS meeting.</noscript>
</body>
</html>
