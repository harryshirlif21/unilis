services:
  app:
    environment:
      APP_ENV: development
    volumes:
      # Serve the working tree directly; PHP/HTML changes are visible immediately.
      - .:/var/www/html
      - app_vendor:/var/www/html/vendor
      - ./apache.conf:/etc/apache2/sites-available/000-default.conf.template

  meeting-server:
    build:
      context: ./meeting-server
      dockerfile: Dockerfile

volumes:
  app_vendor:
