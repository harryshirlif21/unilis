<VirtualHost *:80>
    ServerName unilis.jhubafrica.com
    DocumentRoot /var/www/html

    ProxyPreserveHost On

    ProxyPass /meeting-ui/ http://__MEETING_PROXY_HOST__:__MEETING_PROXY_PORT__/meeting-ui/
    ProxyPassReverse /meeting-ui/ http://__MEETING_PROXY_HOST__:__MEETING_PROXY_PORT__/meeting-ui/

    ProxyPass /ws/signaling ws://__MEETING_PROXY_HOST__:__MEETING_PROXY_PORT__/ws/signaling
    ProxyPassReverse /ws/signaling ws://__MEETING_PROXY_HOST__:__MEETING_PROXY_PORT__/ws/signaling

    ProxyPass /ws/media ws://__MEETING_PROXY_HOST__:__MEETING_PROXY_PORT__/ws/media
    ProxyPassReverse /ws/media ws://__MEETING_PROXY_HOST__:__MEETING_PROXY_PORT__/ws/media

    # Suppress the version banner on error pages.
    ServerSignature Off

    # Defense in depth: the document root is a git checkout, so refuse its
    # metadata at the server level rather than relying on .htaccess staying
    # enabled. /.git/HEAD, /.git/config and /.git/index were all downloadable
    # before this, which makes the whole history reconstructable.
    <DirectoryMatch "/\.git">
        Require all denied
    </DirectoryMatch>

    <Directory /var/www/html>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <Directory /var/www/html/smart-lab>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <Directory /var/www/html/modules>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>