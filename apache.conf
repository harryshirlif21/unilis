<VirtualHost *:80>
    ServerName unilis.jhubafrica.com
    DocumentRoot /var/www/html

    ProxyPreserveHost On

    ProxyPass /meeting-ui/ http://meeting-server:8765/meeting-ui/
    ProxyPassReverse /meeting-ui/ http://meeting-server:8765/meeting-ui/

    ProxyPass /ws/signaling ws://meeting-server:8765/ws/signaling
    ProxyPassReverse /ws/signaling ws://meeting-server:8765/ws/signaling

    ProxyPass /ws/media ws://meeting-server:8765/ws/media
    ProxyPassReverse /ws/media ws://meeting-server:8765/ws/media

    <Directory /var/www/html>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <Directory /var/www/html/smart-lab>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
