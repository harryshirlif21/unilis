name: AWS CI/CD Pipeline

on:
  push:
    branches:
      - aws

concurrency:
  group: aws-production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Login to DockerHub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push App Image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}:aws-${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}:aws-latest

      - name: Build and Push Meeting Media Image
        uses: docker/build-push-action@v7.3.0
        with:
          context: ./meeting-server
          file: ./meeting-server/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/unilis-meeting-media:aws-${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/unilis-meeting-media:aws-latest

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AWS_DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 ${{ secrets.AWS_SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Deploy to AWS Server
        run: |
          ssh ${{ secrets.AWS_SERVER_BOT }}@${{ secrets.AWS_SERVER_IP }} << 'EOF'
            set -e

            DEPLOY_PATH="${{ secrets.AWS_DEPLOY_PATH }}"
            if [ -z "$DEPLOY_PATH" ]; then
              echo "AWS_DEPLOY_PATH secret is not set."
              exit 1
            fi
            if [ ! -d "$DEPLOY_PATH/.git" ] || [ ! -f "$DEPLOY_PATH/docker-compose.yml" ]; then
              echo "DEPLOY_PATH='$DEPLOY_PATH' is not a valid checkout."
              exit 1
            fi
            cd "$DEPLOY_PATH"

            # Create persistent upload directories
            mkdir -p /srv/unilis-uploads/uploads/short_courses/sponsors
            mkdir -p /srv/unilis-uploads/uploads/course_images
            mkdir -p /srv/unilis-uploads/uploads/course_pdfs
            mkdir -p /srv/unilis-uploads/uploads/course_videos
            mkdir -p /srv/unilis-uploads/uploads/course_audio
            mkdir -p /srv/unilis-uploads/uploads/course_presentations
            mkdir -p /srv/unilis-uploads/uploads/course_diagrams
            mkdir -p /srv/unilis-uploads/uploads/chat
            mkdir -p /srv/unilis-uploads/uploads/answers
            mkdir -p /srv/unilis-uploads/assets/uploads
            mkdir -p /srv/unilis-uploads/assets/assignments
            mkdir -p /srv/unilis-uploads/assets/meetings
            mkdir -p /srv/unilis-uploads/assets/requested_files
            chmod -R 775 /srv/unilis-uploads

            git pull --ff-only origin aws

            docker-compose pull
            docker-compose up -d --remove-orphans

            docker-compose ps
          EOF
