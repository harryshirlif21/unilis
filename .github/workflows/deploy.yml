name: UNILIS AWS Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: unilis-aws-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify deployment files
        run: |
          for f in docker-compose.yml dockerfile apache.conf start.sh meeting-server/Dockerfile .env.docker.example; do
            test -f "$f" || { echo "::error::Missing required file: $f"; exit 1; }
          done
      - name: PHP syntax check
        run: |
          set -e
          find . -path ./vendor -prune -o -path ./smart-lab/vendor -prune -o -name '*.php' -print0 |
            xargs -0 -r -n1 php -l
      - name: Validate Compose file
        run: |
          cat > .env <<'EOF'
          MYSQL_ROOT_PASSWORD=ci-placeholder
          MYSQL_PASSWORD=ci-placeholder
          SMARTLAB_MYSQL_PASSWORD=ci-placeholder
          MEETING_MEDIA_WS_URL=ws://localhost:8765/ws/media
          MEETING_PYTHON_APP_URL=http://localhost
          MEETING_ALLOWED_ORIGINS=*
          MEETING_API_KEY=ci-placeholder
          EOF
          docker compose -f docker-compose.yml config -q

  build:
    name: Build and push AWS images
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4.2.0
      - uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push app image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ./dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/unilis-app:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/unilis-app:latest
      - name: Build and push meeting image
        uses: docker/build-push-action@v7.3.0
        with:
          context: ./meeting-server
          file: ./meeting-server/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/unilis-meeting-media:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/unilis-meeting-media:latest

  deploy:
    name: Deploy AWS
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Configure SSH
        env:
          AWS_DEPLOY_KEY: ${{ secrets.AWS_DEPLOY_KEY }}
          AWS_SERVER_IP: ${{ secrets.AWS_SERVER_IP }}
        run: |
          set -euo pipefail
          : "${AWS_DEPLOY_KEY:?Set the AWS_DEPLOY_KEY GitHub Actions secret.}"
          : "${AWS_SERVER_IP:?Set the AWS_SERVER_IP GitHub Actions secret.}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$AWS_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null
          if ! ssh-keyscan -T 10 -H "$AWS_SERVER_IP" > "$RUNNER_TEMP/unilis-aws-known-hosts" 2>/dev/null; then
            echo "Unable to retrieve the AWS SSH host key. Check AWS_SERVER_IP and runner network access."
            exit 1
          fi
          if [ ! -s "$RUNNER_TEMP/unilis-aws-known-hosts" ]; then
            echo "AWS SSH host-key scan returned no keys. Check AWS_SERVER_IP and runner network access."
            exit 1
          fi
          cat "$RUNNER_TEMP/unilis-aws-known-hosts" >> ~/.ssh/known_hosts
      - name: Deploy exact AWS version
        env:
          MPESA_ENVIRONMENT: sandbox
          MPESA_CONSUMER_KEY: ${{ secrets.MPESA_CONSUMER_KEY }}
          MPESA_CONSUMER_SECRET: ${{ secrets.MPESA_CONSUMER_SECRET }}
          MPESA_SHORTCODE: ${{ secrets.MPESA_SHORTCODE }}
          MPESA_PASSKEY: ${{ secrets.MPESA_PASSKEY }}
          MPESA_STK_RESULT_URL: ${{ secrets.MPESA_STK_RESULT_URL }}
        run: |
          set -euo pipefail
          umask 077
          LOCAL_MPESA_ENV="$(mktemp)"
          trap 'rm -f "$LOCAL_MPESA_ENV"' EXIT
          printf 'MPESA_ENVIRONMENT=sandbox\n' > "$LOCAL_MPESA_ENV"
          if [ -n "$MPESA_CONSUMER_KEY" ] \
            && [ -n "$MPESA_CONSUMER_SECRET" ] \
            && [ -n "$MPESA_SHORTCODE" ] \
            && [ -n "$MPESA_PASSKEY" ] \
            && [ -n "$MPESA_STK_RESULT_URL" ]; then
            printf 'MPESA_CONSUMER_KEY=%s\nMPESA_CONSUMER_SECRET=%s\nMPESA_SHORTCODE=%s\nMPESA_PASSKEY=%s\nMPESA_STK_RESULT_URL=%s\n' \
              "$MPESA_CONSUMER_KEY" "$MPESA_CONSUMER_SECRET" "$MPESA_SHORTCODE" "$MPESA_PASSKEY" "$MPESA_STK_RESULT_URL" \
              >> "$LOCAL_MPESA_ENV"
            echo "Using M-Pesa sandbox settings from GitHub Actions secrets."
          else
            echo "::warning::One or more M-Pesa GitHub Actions secrets are missing; preserving the deployment server's existing M-Pesa values from .env."
          fi
          chmod 600 "$LOCAL_MPESA_ENV"
          ssh '${{ secrets.AWS_SERVER_BOT }}@${{ secrets.AWS_SERVER_IP }}' "umask 077 && cat > /tmp/unilis-mpesa-${{ github.run_id }}.env" < "$LOCAL_MPESA_ENV"

          ssh '${{ secrets.AWS_SERVER_BOT }}@${{ secrets.AWS_SERVER_IP }}' <<'EOF'
            set -euo pipefail
            MPESA_ENV_FILE="/tmp/unilis-mpesa-${{ github.run_id }}.env"
            test -r "$MPESA_ENV_FILE"
            trap 'rm -f "$MPESA_ENV_FILE"' EXIT

            DEPLOY_PATH='${{ secrets.AWS_DEPLOY_PATH }}'
            test -d "$DEPLOY_PATH/.git"
            test -f "$DEPLOY_PATH/docker-compose.yml"
            cd "$DEPLOY_PATH"

            git fetch --no-tags origin main --prune
            git checkout --detach '${{ github.sha }}'
            git reset --hard '${{ github.sha }}'
            test "$(git rev-parse HEAD)" = '${{ github.sha }}'

            export DOCKER_USERNAME='${{ secrets.DOCKER_USERNAME }}'
            export IMAGE_TAG='${{ github.sha }}'
            if docker compose version >/dev/null 2>&1; then
              DC='docker compose'
            elif command -v docker-compose >/dev/null 2>&1; then
              DC='docker-compose'
            else
              echo 'No Docker Compose command found.'
              exit 1
            fi

            echo "Pulling AWS images with tag ${IMAGE_TAG}"
            $DC pull app meeting-server
            $DC --env-file .env --env-file "$MPESA_ENV_FILE" up -d --no-build --force-recreate --remove-orphans
            docker inspect unilis-app --format 'unilis-app image={{.Config.Image}} id={{.Image}}'
            docker inspect unilis-meeting-media --format 'unilis-meeting-media image={{.Config.Image}} id={{.Image}}'
            $DC ps
          EOF
