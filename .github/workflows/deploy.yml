name: Deploy UNILIS to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: unilis-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate deployment configuration
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify required deployment files
        run: |
          set -euo pipefail
          for file in docker-compose.yml dockerfile apache.conf start.sh meeting-server/Dockerfile; do
            test -f "$file" || { echo "::error::Missing required file: $file"; exit 1; }
          done

      - name: Validate Docker Compose
        env:
          MYSQL_ROOT_PASSWORD: validation-only-root-password
          MYSQL_PASSWORD: validation-only-app-password
          SMARTLAB_MYSQL_PASSWORD: validation-only-smartlab-password
          MEETING_API_KEY: validation-only-meeting-key
          MEETING_ALLOWED_ORIGINS: http://localhost:8080
          MEETING_PYTHON_APP_URL: http://localhost:8080
          MEETING_MEDIA_WS_URL: ws://localhost:8765/ws/media
        run: docker compose -f docker-compose.yml config -q

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: validate
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$EC2_SSH_KEY" || { echo "::error::EC2_SSH_KEY is not configured."; exit 1; }
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$EC2_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" >/dev/null || {
            echo "::error::EC2_SSH_KEY is not a usable, unencrypted private key."
            exit 1
          }

      - name: Deploy commit to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$EC2_HOST" || { echo "::error::EC2_HOST is not configured."; exit 1; }
          test -n "$EC2_USER" || { echo "::error::EC2_USER is not configured."; exit 1; }

          # accept-new verifies the host key on later runs, but trusts it on the
          # first connection. Replace it with a pre-populated known_hosts entry
          # if your EC2 host key fingerprint is managed out of band.
          ssh -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=accept-new \
            "$EC2_USER@$EC2_HOST" "bash -s -- '$DEPLOY_SHA'" <<'REMOTE_SCRIPT'
              set -Eeuo pipefail

              DEPLOY_SHA="$1"
              DEPLOY_DIR=/home/ubuntu/unilis
              REPOSITORY=https://github.com/harryshirlif21/unilis.git

              on_error() {
                status=$?
                echo "Deployment failed (exit $status). Recent Compose logs follow:" >&2
                if [ -n "${DC:-}" ] && [ -d "$DEPLOY_DIR" ]; then
                  (cd "$DEPLOY_DIR" && $DC logs --tail=100) >&2 || true
                fi
                exit "$status"
              }
              trap on_error ERR

              if docker compose version >/dev/null 2>&1; then
                DC='docker compose'
              elif command -v docker-compose >/dev/null 2>&1; then
                DC='docker-compose'
              else
                echo 'Docker Compose is not installed on the EC2 host.' >&2
                exit 1
              fi

              if [ ! -d "$DEPLOY_DIR/.git" ]; then
                if [ -e "$DEPLOY_DIR" ] && [ "$(find "$DEPLOY_DIR" -mindepth 1 -maxdepth 1 -print -quit)" ]; then
                  echo "$DEPLOY_DIR exists but is not a Git checkout; refusing to overwrite it." >&2
                  exit 1
                fi
                mkdir -p "$(dirname "$DEPLOY_DIR")"
                git clone "$REPOSITORY" "$DEPLOY_DIR"
              fi

              cd "$DEPLOY_DIR"
              test -f .env || {
                echo 'Missing /home/ubuntu/unilis/.env. Create it on EC2 from .env.docker.example before deploying.' >&2
                exit 1
              }

              # .env is ignored by Git, so this update never overwrites its
              # production secrets. Named database volumes are never removed.
              git fetch origin main --prune
              git checkout -B main origin/main
              git reset --hard "$DEPLOY_SHA"

              # Bind-mounted user content survives image rebuilds. The image
              # runs Apache as www-data (UID/GID 33), so create these host
              # directories with matching ownership before starting containers.
              for upload_dir in \
                /srv/unilis-uploads/uploads \
                /srv/unilis-uploads/assets/uploads \
                /srv/unilis-uploads/assets/assignments \
                /srv/unilis-uploads/assets/meetings \
                /srv/unilis-uploads/assets/requested_files \
                /srv/unilis-uploads/smart-lab/uploads; do
                sudo install -d -o 33 -g 33 -m 0775 "$upload_dir"
              done

              $DC --env-file .env config -q
              $DC pull
              $DC build
              $DC up -d --remove-orphans
              $DC ps

              # There is no dedicated root health endpoint. Check Apache's
              # actual public entry point from the EC2 host, allowing startup.
              for attempt in $(seq 1 12); do
                if curl --fail --silent --show-error http://127.0.0.1:8080/ >/dev/null; then
                  echo 'UNILIS health check passed.'
                  exit 0
                fi
                sleep 5
              done
              echo 'UNILIS health check failed: http://127.0.0.1:8080/ did not return success.' >&2
              exit 1
          REMOTE_SCRIPT
