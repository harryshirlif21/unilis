name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - closed

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Login to DockerHub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push App Image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}:latest

      - name: Build and Push Meeting Media Image
        uses: docker/build-push-action@v7.3.0
        with:
          context: ./meeting-server
          file: ./meeting-server/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/unilis-meeting-media:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/unilis-meeting-media:latest

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Deploy to Production Server
        env:
          MPESA_ENVIRONMENT: sandbox
          MPESA_CONSUMER_KEY: ${{ secrets.MPESA_CONSUMER_KEY }}
          MPESA_CONSUMER_SECRET: ${{ secrets.MPESA_CONSUMER_SECRET }}
          MPESA_SHORTCODE: ${{ secrets.MPESA_SHORTCODE }}
          MPESA_PASSKEY: ${{ secrets.MPESA_PASSKEY }}
          MPESA_STK_RESULT_URL: ${{ secrets.MPESA_STK_RESULT_URL }}
        run: |
          set -euo pipefail
          : "${MPESA_CONSUMER_KEY:?Set the MPESA_CONSUMER_KEY GitHub Actions secret.}"
          : "${MPESA_CONSUMER_SECRET:?Set the MPESA_CONSUMER_SECRET GitHub Actions secret.}"
          : "${MPESA_SHORTCODE:?Set the MPESA_SHORTCODE GitHub Actions secret.}"
          : "${MPESA_PASSKEY:?Set the MPESA_PASSKEY GitHub Actions secret.}"
          : "${MPESA_STK_RESULT_URL:?Set the MPESA_STK_RESULT_URL GitHub Actions secret.}"
          umask 077
          LOCAL_MPESA_ENV="$(mktemp)"
          trap 'rm -f "$LOCAL_MPESA_ENV"' EXIT
          printf 'MPESA_ENVIRONMENT=%s\nMPESA_CONSUMER_KEY=%s\nMPESA_CONSUMER_SECRET=%s\nMPESA_SHORTCODE=%s\nMPESA_PASSKEY=%s\nMPESA_STK_RESULT_URL=%s\n' \
            "$MPESA_ENVIRONMENT" "$MPESA_CONSUMER_KEY" "$MPESA_CONSUMER_SECRET" "$MPESA_SHORTCODE" "$MPESA_PASSKEY" "$MPESA_STK_RESULT_URL" \
            > "$LOCAL_MPESA_ENV"
          chmod 600 "$LOCAL_MPESA_ENV"
          scp -q "$LOCAL_MPESA_ENV" '${{ secrets.SERVER_BOT }}@${{ secrets.SERVER_IP }}:/tmp/unilis-mpesa-${{ github.run_id }}.env'

          ssh ${{ secrets.SERVER_BOT }}@${{ secrets.SERVER_IP }} << 'EOF'
            set -e

            MPESA_ENV_FILE="/tmp/unilis-mpesa-${{ github.run_id }}.env"
            test -r "$MPESA_ENV_FILE"
            trap 'rm -f "$MPESA_ENV_FILE"' EXIT

            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            if [ -z "$DEPLOY_PATH" ]; then
              echo "DEPLOY_PATH secret is not set - refusing to guess the checkout location."
              exit 1
            fi
            if [ ! -d "$DEPLOY_PATH/.git" ] || [ ! -f "$DEPLOY_PATH/docker-compose.yml" ]; then
              echo "DEPLOY_PATH='$DEPLOY_PATH' is not a git checkout containing docker-compose.yml."
              echo "Set it to the absolute path of the deployment checkout, e.g. /srv/unilis."
              exit 1
            fi
            cd "$DEPLOY_PATH"

            # Create persistent upload directories outside the git checkout.
            # These survive git pulls, container rebuilds and Docker restarts permanently.
            mkdir -p /srv/unilis-uploads/uploads/short_courses/sponsors
            mkdir -p /srv/unilis-uploads/uploads/course_images
            mkdir -p /srv/unilis-uploads/uploads/course_pdfs
            mkdir -p /srv/unilis-uploads/uploads/course_videos
            mkdir -p /srv/unilis-uploads/uploads/course_audio
            mkdir -p /srv/unilis-uploads/uploads/course_presentations
            mkdir -p /srv/unilis-uploads/uploads/course_diagrams
            mkdir -p /srv/unilis-uploads/uploads/chat
            mkdir -p /srv/unilis-uploads/uploads/answers
            mkdir -p /srv/unilis-uploads/assets/uploads
            mkdir -p /srv/unilis-uploads/assets/assignments
            mkdir -p /srv/unilis-uploads/assets/meetings
            mkdir -p /srv/unilis-uploads/assets/requested_files
            # Make sure the web server process can write to these directories
            chmod -R 775 /srv/unilis-uploads

            # Fail loudly rather than deploy half an update: --ff-only refuses if the
            # server checkout has diverged (local edits to compose, deleted files, etc).
            git pull --ff-only

            docker compose --env-file .env --env-file "$MPESA_ENV_FILE" build
            docker compose --env-file .env --env-file "$MPESA_ENV_FILE" up -d --remove-orphans

            docker compose ps
          EOF
