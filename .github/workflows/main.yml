name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - closed

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push App Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}:latest

      - name: Build and Push Meeting Media Image
        uses: docker/build-push-action@v5
        with:
          context: ./meeting-server
          file: ./meeting-server/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/unilis-meeting-media:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/unilis-meeting-media:latest

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Deploy to Production Server
        run: |
          ssh ${{ secrets.SERVER_BOT }}@${{ secrets.SERVER_IP }} << 'EOF'
            docker pull ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}:latest
            docker stop unilis-app || true
            docker rm unilis-app || true
            docker run -d \
              --name unilis-app \
              -p 80:80 \
              ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}:latest

            docker pull ${{ secrets.DOCKER_USERNAME }}/unilis-meeting-media:latest
            docker stop unilis-meeting-media || true
            docker rm unilis-meeting-media || true
            docker run -d \
              --name unilis-meeting-media \
              -p 3001:3001 \
              ${{ secrets.DOCKER_USERNAME }}/unilis-meeting-media:latest
          EOF