name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - closed

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Login to DockerHub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push App Image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}:latest

      - name: Build and Push Meeting Media Image
        uses: docker/build-push-action@v7.3.0
        with:
          context: ./meeting-server
          file: ./meeting-server/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/unilis-meeting-media:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/unilis-meeting-media:latest

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      # Production is compose-managed from a checkout on the server: the app
      # container bind-mounts that checkout, so PHP goes live on pull, while
      # meeting-server bakes its Python in at build time and must be rebuilt.
      # Do not hand-write `docker run` here — it would remove the compose-managed
      # containers and recreate them without their mounts, network, or env.
      - name: Deploy to Production Server
        run: |
          ssh ${{ secrets.SERVER_BOT }}@${{ secrets.SERVER_IP }} << 'EOF'
            set -e

            # DEPLOY_PATH is a filesystem path to the checkout on this server
            # (the output of `pwd` there), not a password or a project name.
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            if [ -z "$DEPLOY_PATH" ]; then
              echo "DEPLOY_PATH secret is not set - refusing to guess the checkout location."
              exit 1
            fi
            if [ ! -d "$DEPLOY_PATH/.git" ] || [ ! -f "$DEPLOY_PATH/docker-compose.yml" ]; then
              echo "DEPLOY_PATH='$DEPLOY_PATH' is not a git checkout containing docker-compose.yml."
              echo "Set it to the absolute path of the deployment checkout, e.g. /srv/unilis."
              exit 1
            fi
            cd "$DEPLOY_PATH"

            # Fail loudly rather than deploy half an update: --ff-only refuses if the
            # server checkout has diverged (local edits to compose, deleted files, etc).
            git pull --ff-only

            docker compose build
            docker compose up -d --remove-orphans

            docker compose ps
          EOF