name: CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main
    types:
      - closed

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push App Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            hilkim21/unilis-app:1.0
            hilkim21/unilis-app:${{ github.sha }}

      - name: Build and Push Meeting Service Image
        uses: docker/build-push-action@v5
        with:
          context: ./meeting-server
          file: ./meeting-server/Dockerfile
          push: true
          tags: |
            hilkim21/unilis-meeting-media:1.0
            hilkim21/unilis-meeting-media:${{ github.sha }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Fix remote shell (guard .bashrc and .profile)
        run: ssh -T ${{ secrets.SERVER_BOT }}@${{ secrets.SERVER_IP }} "grep -q 'interactive.*return' ~/.bashrc 2>/dev/null || sed -i '1i# non-interactive guard\\n[[ \\$- == *i* ]] || return 0\\n' ~/.bashrc; grep -q 'interactive.*return' ~/.profile 2>/dev/null || sed -i '1i# non-interactive guard\\n[[ \\$- == *i* ]] || return 0\\n' ~/.profile; grep -q 'interactive.*return' ~/.bash_profile 2>/dev/null || sed -i '1i# non-interactive guard\\n[[ \\$- == *i* ]] || return 0\\n' ~/.bash_profile; echo done"

      - name: Upload docker-compose.yml
        run: |
          ssh -T ${{ secrets.SERVER_BOT }}@${{ secrets.SERVER_IP }} "mkdir -p ~/unilis && rm -f ~/unilis/docker-compose.yml"
          ssh -T ${{ secrets.SERVER_BOT }}@${{ secrets.SERVER_IP }} 'cat > ~/unilis/docker-compose.yml' < docker-compose.yml

      - name: Sync live-engagement module
        run: |
          ssh -T ${{ secrets.SERVER_BOT }}@${{ secrets.SERVER_IP }} "mkdir -p ~/unilis/modules/live-engagement"
          tcos
      - name: Sync apache.conf
        run: ssh -T ${{ secrets.SERVER_BOT }}@${{ secrets.SERVER_IP }} 'cat > ~/unilis/apache.conf' < apache.conf

      - name: Deploy to Production Server
        run: |
          ssh ${{ secrets.SERVER_BOT }}@${{ secrets.SERVER_IP }} << 'EOF'
            set -e
            cd ~/unilis

            docker compose -f docker-compose.yml pull
            docker compose -f docker-compose.yml up -d --remove-orphans

            echo "--- Container status after deploy ---"
            docker compose -f docker-compose.yml ps
          EOF