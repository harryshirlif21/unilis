name: CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main
    types:
      - closed

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push App Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            hilkim21/unilis-app:1.0
            hilkim21/unilis-app:${{ github.sha }}

      - name: Build and Push Meeting Service Image
        uses: docker/build-push-action@v5
        with:
          context: ./meeting-server
          file: ./meeting-server/Dockerfile
          push: true
          tags: |
            hilkim21/unilis-meeting-media:1.0
            hilkim21/unilis-meeting-media:${{ github.sha }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Fix remote shell for non-interactive sessions
        run: ssh -T ${{ secrets.SERVER_BOT }}@${{ secrets.SERVER_IP }} "grep -q 'interactive' ~/.bashrc 2>/dev/null || printf '\\n# non-interactive guard\\n[[ \$- == *i* ]] || return 0\\n' >> ~/.bashrc"

      - name: Upload docker-compose file
        run: |
          ssh -T ${{ secrets.SERVER_BOT }}@${{ secrets.SERVER_IP }} "mkdir -p ~/unilis"
          scp -o StrictHostKeyChecking=no -o LogLevel=ERROR docker-compose.yml ${{ secrets.SERVER_BOT }}@${{ secrets.SERVER_IP }}:~/unilis/docker-compose.yml

      - name: Sync application code to production server
        run: |
          ssh -T ${{ secrets.SERVER_BOT }}@${{ secrets.SERVER_IP }} "mkdir -p ~/unilis/modules/live-engagement"
          tar -czf - modules/live-engagement/ | ssh -T ${{ secrets.SERVER_BOT }}@${{ secrets.SERVER_IP }} "tar -xzf - -C ~/unilis/modules/live-engagement/"

      - name: Deploy to Production Server
        run: |
          ssh ${{ secrets.SERVER_BOT }}@${{ secrets.SERVER_IP }} << 'EOF'
            mkdir -p ~/unilis
            cd ~/unilis

            docker compose -f docker-compose.yml pull
            docker compose -f docker-compose.yml up -d --remove-orphans

            echo "--- Container status after deploy ---"
            docker compose -f docker-compose.yml ps
          EOF