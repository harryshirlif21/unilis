name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - closed

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Login to DockerHub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push App Image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}:latest

      - name: Build and Push Meeting Media Image
        uses: docker/build-push-action@v7.3.0
        with:
          context: ./meeting-server
          file: ./meeting-server/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/unilis-meeting-media:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/unilis-meeting-media:latest

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Deploy to Production Server
        run: |
          ssh ${{ secrets.SERVER_BOT }}@${{ secrets.SERVER_IP }} << 'EOF'
            set -e

            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            if [ -z "$DEPLOY_PATH" ]; then
              echo "DEPLOY_PATH secret is not set - refusing to guess the checkout location."
              exit 1
            fi
            if [ ! -d "$DEPLOY_PATH/.git" ] || [ ! -f "$DEPLOY_PATH/docker-compose.yml" ]; then
              echo "DEPLOY_PATH='$DEPLOY_PATH' is not a git checkout containing docker-compose.yml."
              exit 1
            fi
            cd "$DEPLOY_PATH"

            # Diagnostics - show who we are and what exists
            echo "=== DEPLOY DIAGNOSTICS ==="
            echo "User: $(whoami)"
            echo "Deploy path: $DEPLOY_PATH"
            echo "/srv exists: $(test -d /srv && echo YES || echo NO)"
            echo "/srv/unilis-uploads exists: $(test -d /srv/unilis-uploads && echo YES || echo NO)"
            echo "/srv/unilis-uploads owner: $(stat -c '%U:%G %a' /srv/unilis-uploads 2>/dev/null || echo NOT_FOUND)"
            echo "/srv/unilis-uploads/uploads/short_courses exists: $(test -d /srv/unilis-uploads/uploads/short_courses && echo YES || echo NO)"
            echo "Files in short_courses: $(ls /srv/unilis-uploads/uploads/short_courses 2>/dev/null | wc -l || echo 0)"
            echo "Can write to /srv/unilis-uploads: $(touch /srv/unilis-uploads/.writetest 2>/dev/null && echo YES && rm /srv/unilis-uploads/.writetest || echo NO)"
            echo "==========================="

            # Create persistent upload directories
            mkdir -p /srv/unilis-uploads/uploads/short_courses/sponsors
            mkdir -p /srv/unilis-uploads/uploads/course_images
            mkdir -p /srv/unilis-uploads/uploads/course_pdfs
            mkdir -p /srv/unilis-uploads/uploads/course_videos
            mkdir -p /srv/unilis-uploads/uploads/course_audio
            mkdir -p /srv/unilis-uploads/uploads/course_presentations
            mkdir -p /srv/unilis-uploads/uploads/course_diagrams
            mkdir -p /srv/unilis-uploads/uploads/chat
            mkdir -p /srv/unilis-uploads/uploads/answers
            mkdir -p /srv/unilis-uploads/assets/uploads
            mkdir -p /srv/unilis-uploads/assets/assignments
            mkdir -p /srv/unilis-uploads/assets/meetings
            mkdir -p /srv/unilis-uploads/assets/requested_files
            chmod -R 775 /srv/unilis-uploads

            echo "After mkdir - Files in short_courses: $(ls /srv/unilis-uploads/uploads/short_courses 2>/dev/null | wc -l || echo 0)"

            git pull --ff-only

            docker compose build
            docker compose up -d --remove-orphans
            docker compose ps
          EOF
