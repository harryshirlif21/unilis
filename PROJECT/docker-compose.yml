version: "3.9" services: # nnn PostgreSQL Database
db: image: postgres:15-alpine
container_name: medai_db restart: unless-stopped environment: POSTGRES_DB: ${POSTGRES_DB:-medai}
POSTGRES_USER: ${POSTGRES_USER:-medai_user} POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medai_pass} volumes: -
pg_data:/var/lib/postgresql/data - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql ports: - "5432:5432"
healthcheck: test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medai_user}"] interval: 10s timeout: 5s
retries: 5 networks: - medai_net # nnn Redis (job queue / caching)
redis: image: redis:7-alpine container_name:
medai_redis restart: unless-stopped ports: - "6379:6379" networks: - medai_net healthcheck: test: ["CMD",
"redis-cli", "ping"] interval: 10s timeout: 5s retries: 5 # nnn FastAPI Backend (Gateway)
 backend: build: context: ./backend dockerfile:
Dockerfile container_name: medai_backend restart: unless-stopped env_file: .env environment: DATABASE_URL: p
ostgresql+asyncpg://${POSTGRES_USER:-medai_user}:${POSTGRES_PASSWORD:-medai_pass}@db:5432/${POSTGRES_DB:-med
ai} REDIS_URL: redis://redis:6379/0 SCORING_SERVICE_URL: http://scoring:8001 DETECTION_SERVICE_URL:
http://detection:8002 OCR_SERVICE_URL: http://ocr:8003 MULTIMODAL_SERVICE_URL: http://multimodal:8004
EXPLAINABILITY_SERVICE_URL: http://explainability:8005 INGESTION_SERVICE_URL: http://ingestion:8006 volumes:
- ./STORAGE:/app/storage ports: - "8000:8000" depends_on: db: condition: service_healthy redis: condition:
service_healthy networks: - medai_net # nnn React Frontend
frontend: build: context: ./frontend
dockerfile: Dockerfile container_name: medai_frontend restart: unless-stopped ports: - "3000:80" depends_on:
- backend networks: - medai_net # nnn SCORING Microservice
scoring: build: context: ./SCORING
dockerfile: Dockerfile container_name: medai_scoring restart: unless-stopped env_file: .env environment:
DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-medai_user}:${POSTGRES_PASSWORD:-medai_pass}@db:5432/${P
OSTGRES_DB:-medai} REDIS_URL: redis://redis:6379/1 volumes: - ./STORAGE:/app/storage ports: - "8001:8001"
depends_on: db: condition: service_healthy networks: - medai_net # nnn DETECTION Microservice (YOLOv8 +
U-Net)  detection: build: context: ./DETECTION dockerfile: Dockerfile
container_name: medai_detection restart: unless-stopped env_file: .env volumes: - ./STORAGE:/app/storage -
./DETECTION/weights:/app/weights ports: - "8002:8002" networks: - medai_net # nnn OCR Microservice
(PaddleOCR)  ocr: build: context: ./OCR dockerfile:
Dockerfile container_name: medai_ocr restart: unless-stopped env_file: .env volumes: - ./STORAGE:/app/storage
ports: - "8003:8003" networks: - medai_net # nnn MULTIMODAL Microservice (CLIP + SBERT)
nnnnnnnnnnnnnnnnnnnnnnnnnnnnnnn multimodal: build: context: ./MULTIMODAL_VERIFICATION dockerfile:
Dockerfile container_name: medai_multimodal restart: unless-stopped env_file: .env volumes: -
./STORAGE:/app/storage - ./MULTIMODAL_VERIFICATION/embeddings:/app/embeddings ports: - "8004:8004" networks:
- medai_net # nnn EXPLAINABILITY Microservice (GradCAM) nnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnn
explainability: build: context: ./EXPLAINABILITY dockerfile: Dockerfile container_name: medai_explainability
restart: unless-stopped env_file: .env volumes: - ./STORAGE:/app/storage ports: - "8005:8005" networks: -
medai_net # nnn INGESTION Microservice (PDF parsing) nnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnn ingestion:
build: context: ./INGESTION dockerfile: Dockerfile container_name: medai_ingestion restart: unless-stopped
env_file: .env volumes: - ./STORAGE:/app/storage - ./INGESTION/uploads:/app/uploads ports: - "8006:8006"
networks: - medai_net volumes: pg_data: networks: medai_net: driver: bridge